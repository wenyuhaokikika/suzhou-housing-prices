<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}苏州房价预测工具{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:#0f1419; --card:#1a2332; --text:#e7ecf3; --muted:#8b9bb4;
      --accent:#3d8bfd; --good:#3dd68c; --warn:#f5a524; --xinfang:#a78bfa; --ershou:#38bdf8;
      --border:#243044;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .nav { display:flex; gap:8px 14px; flex-wrap:wrap; align-items:center; padding:14px 28px; border-bottom:1px solid var(--border); background:#121a24; position:sticky; top:0; z-index:10; }
    .nav .brand { font-weight:700; color:var(--text); margin-right:8px; }
    .nav a { color:var(--muted); font-size:0.92rem; }
    .nav a.active, .nav a:hover { color:var(--text); }
    .wrap { padding:24px 28px; max-width:1220px; margin:0 auto; }
    .crumb { color:var(--muted); font-size:0.9rem; margin-bottom:14px; }
    .crumb a { color:var(--muted); }
    h1 { margin:0 0 8px; font-size:1.55rem; }
    h2 { margin:0 0 12px; font-size:1.15rem; }
    .sub { color:var(--muted); margin:0 0 18px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:22px; }
    .region-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; margin-bottom:22px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
    .card .label { color:var(--muted); font-size:0.82rem; }
    .card .value { font-size:1.45rem; font-weight:700; margin-top:4px; }
    .card.clickable { transition:border-color .15s; color:inherit; text-decoration:none; display:block; }
    .card.clickable:hover { border-color:var(--accent); }
    table { width:100%; border-collapse:collapse; font-size:0.92rem; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
    th { color:var(--muted); font-weight:600; white-space:nowrap; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:0.72rem; font-weight:600; }
    .badge.ershou { background:#0c2a3a; color:var(--ershou); }
    .badge.xinfang { background:#2a1f45; color:var(--xinfang); }
    .badge.ok { background:#163528; color:var(--good); }
    .badge.source-demo { background:#3a3418; color:#f5d76e; }
    .provenance { background:#1a2332; border:1px solid #3a3418; border-radius:10px; padding:12px 14px; margin:12px 0 18px; font-size:0.9rem; color:#e7ecf3; }
    .provenance strong { color:#f5d76e; }
    .muted { color:var(--muted); }
    .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
    .tabs a, .tabs span {
      padding:6px 14px; border-radius:999px; border:1px solid var(--border);
      color:var(--muted); font-size:0.9rem;
    }
    .tabs a.active, .tabs span.active { background:var(--accent); border-color:var(--accent); color:#fff; }
    .btn {
      display:inline-block; padding:8px 14px; border-radius:8px; border:1px solid var(--border);
      background:#243044; color:var(--text); cursor:pointer; font-size:0.9rem;
    }
    .btn.primary { background:var(--accent); border-color:var(--accent); }
    .btn:hover { filter:brightness(1.08); }
    .section { margin-bottom:24px; }
    .two-col { display:grid; grid-template-columns:1.2fr 1fr; gap:16px; }
    @media (max-width:900px) { .two-col { grid-template-columns:1fr; } }
    .stat-row { display:flex; flex-wrap:wrap; gap:16px; margin:8px 0 0; }
    .stat-row div strong { display:block; font-size:1.05rem; }
    .stat-row div span { color:var(--muted); font-size:0.78rem; }
    canvas { max-height:300px; }
    .note { font-size:0.82rem; color:var(--muted); margin-top:8px; }
    footer { padding:20px 28px 36px; color:var(--muted); font-size:0.82rem; border-top:1px solid var(--border); margin-top:20px; }

    .filter-toolbar { display:flex; align-items:center; gap:12px; margin:0 0 10px; flex-wrap:wrap; }
    thead tr.filters th { padding:6px 6px 10px; vertical-align:top; font-weight:400; }
    .tf-input, .tf-select {
      width:100%; max-width:140px; box-sizing:border-box;
      background:#0f1419; color:var(--text); border:1px solid var(--border);
      border-radius:6px; padding:5px 7px; font-size:0.78rem;
    }
    .tf-select { max-width:120px; }
    .tf-range { display:flex; align-items:center; gap:3px; }
    .tf-num { max-width:68px; }
    .tf-na { color:var(--muted); font-size:0.75rem; }
    thead tr.labels th { border-bottom:none; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">🏠 苏州房价预测工具</a>
    <a href="/" class="{% if nav=='home' %}active{% endif %}">总览</a>
    <a href="/predict" class="{% if nav=='predict' %}active{% endif %}">🔮 预测</a>
    <a href="/regions/gusu" class="{% if nav=='gusu' %}active{% endif %}">姑苏</a>
    <a href="/regions/huqiu" class="{% if nav=='huqiu' %}active{% endif %}">虎丘</a>
    <a href="/regions/wuzhong" class="{% if nav=='wuzhong' %}active{% endif %}">吴中</a>
    <a href="/regions/xiangcheng" class="{% if nav=='xiangcheng' %}active{% endif %}">相城</a>
    <a href="/regions/wujiang" class="{% if nav=='wujiang' %}active{% endif %}">吴江</a>
    <a href="/regions/sip" class="{% if nav=='sip' %}active{% endif %}">工业园区</a>
    <a href="/communities" class="{% if nav=='communities' %}active{% endif %}">全部小区</a>
    <a href="/watchlist-page" class="{% if nav=='watch' %}active{% endif %}">关注</a>
    <a href="/about-data" class="{% if nav=='about' %}active{% endif %}">数据说明</a>
    <a href="/docs" target="_blank">API</a>
  </nav>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
  <footer>
    仅分析<strong>苏州市辖区</strong>（姑苏、虎丘、吴中、相城、吴江、工业园区），已排除张家港/常熟/太仓/昆山等县级市及外省市。
    当前多为 <strong>示意数据</strong>（非链家/贝壳实爬）。详情见 <a href="/about-data">数据说明</a>。
  </footer>
  <script src="/static/table-filter.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
